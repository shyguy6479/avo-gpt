<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- React Fast Refresh preamble guarantee & benign Vite notice filter -->
    <script>
      (function() {
        // Guarantee React Fast Refresh preamble is immediately present before any module executes
        window.$RefreshReg$ = window.$RefreshReg$ || function() {};
        window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
        window.__vite_plugin_react_preamble_installed__ = true;

        var isViteNotice = function(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var val = args[i];
            if (!val) continue;
            var str = typeof val === 'string' ? val : (val.message || (val.reason && val.reason.message) || String(val));
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite-hmr') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1
            ) {
              return true;
            }
          }
          return false;
        };
        var origConsoleError = console.error;
        console.error = function() {
          if (isViteNotice(arguments)) return;
          origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          if (isViteNotice(arguments)) return;
          origConsoleWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (e && isViteNotice([e.reason])) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          if (e && (isViteNotice([e.message]) || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
